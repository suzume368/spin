name: SpinPK Auto Bot

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:  # Manual trigger option

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run SpinPK Bot
      env:
        SPINPK_TOKEN: ${{ secrets.SPINPK_TOKEN }}
        SPINPK_DEVICE_ID: ${{ secrets.SPINPK_DEVICE_ID }}
      run: |
        python spinpk_bot.py
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: spinpk-results
        path: |
          *.json
          *.log
        retention-days: 7
